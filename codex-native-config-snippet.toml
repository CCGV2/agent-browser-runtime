[mcp_servers.agent-browser-native]
command = "/Users/YOUR_USER/.config/agent-browser-native/playwright-mcp-native-wrapper.sh"
enabled = true
required = true
startup_timeout_sec = 30
tool_timeout_sec = 240
enabled_tools = [
  "browser_navigate",
  "browser_snapshot",
  "browser_find",
  "browser_click",
  "browser_fill_form",
  "browser_type",
  "browser_press_key",
  "browser_select_option",
  "browser_hover",
  "browser_tabs",
  "browser_wait_for",
  "browser_take_screenshot",
  "browser_close",
]
disabled_tools = [
  "browser_run_code_unsafe",
  "browser_evaluate",
]
default_tools_approval_mode = "auto"
